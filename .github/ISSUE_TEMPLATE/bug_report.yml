name: Bug Report
description: Create a report to help us reproduce and fix an issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug report!
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating System, Python version, FFmpeg version
      placeholder: "e.g., Windows 11, Python 3.12, FFmpeg 7.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe the exact steps to reproduce the issue
      placeholder: "1. Upload video...\n2. Configure trim...\n3. Click Process"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Live Log Output
      description: Relevant lines from the Live Log panel (remove personal file paths before submitting)
